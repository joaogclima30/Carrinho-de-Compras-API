spring:
  application:
    name: carrinhoAPI
  profiles:
    default: dev
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: ${app.images.max-size}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:26MB}
api:
  prefix: ${API_PREFIX:/api/v1}
app:
  images:
    max-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
    max-count: ${UPLOAD_MAX_FILES:5}
    max-pixels: ${UPLOAD_MAX_PIXELS:20000000}
  seed:
    enabled: false
auth:
  token:
    expirationInMils: 3600000
    jwtSecret: xcMs5RTMRNE43A9u71XU3fzFY+XVG1AGxbbfRPoab60